[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-minimizer"
version = "0.1.0"
description = "Standalone patch minimization for AI agent trajectories"
requires-python = ">=3.10"
dependencies = ["diff-match-patch", "unidiff", "networkx", "requests", "aiohttp", "bashlex>=0.18"]

[project.optional-dependencies]
# AIDEV-NOTE: 4.0.3 restores required harness modules; 5.x removes APIs used by TRIM.
swebench = ["datasets", "docker", "swebench>=4.0.3,<5", "huggingface_hub"]
neural = ["litellm"]

[tool.setuptools.packages.find]
where = ["src"]
